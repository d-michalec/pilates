@if (!isConfigured()) {
  <p-message
    severity="warn"
    text="Widget Fitssey jest przygotowany, ale brakuje UUID studia w konfiguracji frontendu."
  />
} @else if (errorMessage()) {
  <p-message severity="error" [text]="errorMessage() ?? ''" />
} @else {
  <!--
    Bez własnego napisu o ładowaniu: stan pokazuje strona osadzająca (grafik ma
    swój szkielet). Wcześniej stał tu akapit "Ładowanie grafiku...", który
    nachodził na ten szkielet - trzy komunikaty o ładowaniu naraz.
  -->
  <div class="fitssey-widget-host">
    @if (widget === 'course') {
      <lb-course-widget
        [attr.uuid]="studioUuid"
        [attr.base-url]="baseUrl"
        [attr.hide-header]="hideHeader ? 'true' : null"
      ></lb-course-widget>
    } @else {
      <lb-schedule-widget
        [attr.uuid]="studioUuid"
        [attr.base-url]="baseUrl"
        [attr.hide-header]="hideHeader ? 'true' : null"
      ></lb-schedule-widget>
    }
  </div>
}
