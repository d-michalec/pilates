<main class="contact-page">
  <app-site-header tone="light" />

  <section class="contact-hero" aria-label="Kontakt">
    <div class="contact-image">
      @if (imageUrl(); as url) {
        <img [src]="url" [alt]="imageAlt()" decoding="async" fetchpriority="high" />
      } @else {
        <span class="contact-image-placeholder" aria-hidden="true"></span>
      }
    </div>

    <div class="contact-copy">
      <h1>{{ 'contactPage.title' | t }}</h1>

      <dl>
        <div>
          <dt>{{ 'contactPage.general' | t }}</dt>
          <dd><a [href]="'mailto:' + kontakt.email">{{ kontakt.email }}</a></dd>
          <dd><a [href]="'tel:' + kontakt.phoneLink">{{ kontakt.phoneDisplay }}</a></dd>
        </div>
        <div>
          <dt>{{ 'contactPage.media' | t }}</dt>
          <dd><a [href]="'mailto:' + kontakt.mediaEmail">{{ kontakt.mediaEmail }}</a></dd>
        </div>
      </dl>

      <address>{{ kontakt.street }},<br />{{ kontakt.city }}</address>
    </div>
  </section>

  <app-site-footer />
</main>
