name: babastudio

services:
  postgres:
    image: postgres:17-alpine
    container_name: babastudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-babastudio}
      POSTGRES_USER: ${POSTGRES_USER:-babastudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-babastudio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
