server:
  # Za serwerem pośredniczącym adres klienta przychodzi w nagłówku X-Forwarded-For.
  # Bez tego getRemoteAddr() zwracałby adres Caddy'ego, więc wszyscy odwiedzający
  # dzieliliby jeden limit zapytań i blokowaliby się nawzajem.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

spring:
  application:
    name: babastudio-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/babastudio}
    username: ${DB_USERNAME:babastudio}
    password: ${DB_PASSWORD:babastudio}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

app:
  # Włączane na serwerze: aplikacja odmówi startu na domyślnym admin/admin.
  # Lokalnie zostaje wyłączone, żeby praca nad projektem nie wymagała konfiguracji.
  require-strong-admin: ${APP_REQUIRE_STRONG_ADMIN:false}
  # Adres strony. Backend buduje z niego odnośnik do rezygnacji z newslettera,
  # bo wiadomość wychodzi z serwera i nie ma dostępu do adresu przeglądarki.
  # Lokalnie wskazuje na ng serve, na serwerze podmienia to zmienna SITE_URL.
  site-url: ${SITE_URL:http://localhost:4200}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  uploads-dir: ${UPLOADS_DIR:../uploads}
  contact:
    # Bez wartości wiadomości z formularza tylko zapisują się do bazy i widać je
    # w panelu - nic nie jest wysyłane. To celowe.
    #
    # Wcześniej stał tu prywatny adres na gmailu, wygodny przy pracy nad projektem.
    # Na serwerze z działającym SMTP i pustym CONTACT_TO_EMAIL zgłoszenia klientek
    # studia poszłyby prosto na prywatną skrzynkę programisty - i nikt by tego nie
    # zauważył, bo wszystko działałoby poprawnie.
    to-email: ${CONTACT_TO_EMAIL:}
    from-email: ${MAIL_FROM:}
    retention-days: ${CONTACT_RETENTION_DAYS:365}
    cleanup-cron: ${CONTACT_CLEANUP_CRON:0 20 3 * * *}
  rate-limit:
    # Limit dotyczy formularza kontaktowego i zapisu do newslettera, liczony osobno
    # dla każdego adresu i każdego z tych dwóch zasobów.
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:5}
    window-minutes: ${RATE_LIMIT_WINDOW_MINUTES:10}
  newsletter:
    consent-text: ${NEWSLETTER_CONSENT_TEXT:Wyrażam zgodę na otrzymywanie newslettera BABA Studio i wiem, że mogę wycofać zgodę w każdej chwili.}
    # Po tylu dniach od rezygnacji kasujemy wiersz. Do tego czasu jest dowodem na
    # to, że zgoda była i kiedy została wycofana. Zero wyłącza sprzątanie.
    unsubscribed-retention-days: ${NEWSLETTER_UNSUBSCRIBED_RETENTION_DAYS:365}
    cleanup-cron: ${NEWSLETTER_CLEANUP_CRON:0 40 3 * * *}
    # Sekret w adresie zwrotnym z GetResponse. Ich wywołania nie są podpisane ani
    # uwierzytelnione, więc bez tego każdy, kto zna adres, mógłby wypisywać dowolne
    # osoby. Puste = endpoint odpowiada czterysta czterema i nic nie robi.
    callback-secret: ${NEWSLETTER_CALLBACK_SECRET:}
    getresponse:
      api-url: ${GETRESPONSE_API_URL:https://api.getresponse.com/v3}
      api-key: ${GETRESPONSE_API_KEY:}
      campaign-id: ${GETRESPONSE_CAMPAIGN_ID:}
      admin-url: ${GETRESPONSE_ADMIN_URL:https://app.getresponse.com/}
