spring:
  application:
    name: babastudio-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/babastudio}
    username: ${DB_USERNAME:babastudio}
    password: ${DB_PASSWORD:babastudio}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  uploads-dir: ${UPLOADS_DIR:../uploads}
  contact:
    to-email: ${CONTACT_TO_EMAIL:damianmichalec5@gmail.com}
    from-email: ${MAIL_FROM:}
    retention-days: ${CONTACT_RETENTION_DAYS:365}
    cleanup-cron: ${CONTACT_CLEANUP_CRON:0 20 3 * * *}
  newsletter:
    consent-text: ${NEWSLETTER_CONSENT_TEXT:Wyrażam zgodę na otrzymywanie newslettera BABA Studio i wiem, że mogę wycofać zgodę w każdej chwili.}
    getresponse:
      api-url: ${GETRESPONSE_API_URL:https://api.getresponse.com/v3}
      api-key: ${GETRESPONSE_API_KEY:}
      campaign-id: ${GETRESPONSE_CAMPAIGN_ID:}
      admin-url: ${GETRESPONSE_ADMIN_URL:https://app.getresponse.com/}
